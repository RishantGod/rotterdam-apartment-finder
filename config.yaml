city: rotterdam

price:
  max: 600000
  min: 0

rooms:
  min_bedrooms: 2

construction:
  min_year_built: 1980
  include_unknown_year: true

size:
  min_living_area_m2: 0

neighborhoods:
  - centrum
  - central
  - centraal
  - stadsdriehoek
  - cool
  - cs kwartier
  - weena
  - oostplein
  - blaak
  - beurs

scrape:
  funda:
    enabled: true
    pages: 0     # 0 = scrape all available (capped at 50 pages = ~750 listings)
  pararius:
    enabled: true
    pages: 0     # 0 = scrape all available (capped at 30 pages)
    fetch_details: true   # fetch each detail page for energy label + bedrooms
  huislijn:
    enabled: true
    pages: 0     # 0 = scrape all available (auto-stops when no new listings)

output:
  report_path: output/report.html
  csv_path: output/listings.csv          # filtered listings only
  all_csv_path: output/all_listings.csv  # full DB dump (every listing ever seen)
  db_path: output/listings_db.json       # persistent DB across runs
